<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekenprogramma</title>
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3.4.0/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.3.67/css/materialdesignicons.min.css" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #app { height: 100vh; }
    .canvas-container {
      touch-action: none;
      cursor: crosshair;
    }
    .canvas-container canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app">
    <v-app>
      <v-app-bar density="compact" color="primary">
        <v-app-bar-title>🎨 Tekenprogramma</v-app-bar-title>
        <v-spacer></v-spacer>
        
        <!-- Color picker -->
        <v-menu :close-on-content-click="false">
          <template v-slot:activator="{ props }">
            <v-btn v-bind="props" icon>
              <v-icon :color="currentColor">mdi-palette</v-icon>
            </v-btn>
          </template>
          <v-color-picker v-model="currentColor" mode="hexa"></v-color-picker>
        </v-menu>
        
        <!-- Brush size -->
        <v-menu :close-on-content-click="false">
          <template v-slot:activator="{ props }">
            <v-btn v-bind="props" icon>
              <v-icon>mdi-pencil</v-icon>
            </v-btn>
          </template>
          <v-card class="pa-4" width="200">
            <v-slider
              v-model="brushSize"
              :min="1"
              :max="50"
              :step="1"
              label="Dikte"
              thumb-label
            ></v-slider>
          </v-card>
        </v-menu>
        
        <!-- Tools -->
        <v-btn-toggle v-model="tool" mandatory density="compact" class="mx-2">
          <v-btn value="pen" icon>
            <v-icon>mdi-pencil</v-icon>
          </v-btn>
          <v-btn value="eraser" icon>
            <v-icon>mdi-eraser</v-icon>
          </v-btn>
          <v-btn value="fill" icon>
            <v-icon>mdi-format-color-fill</v-icon>
          </v-btn>
        </v-btn-toggle>
        
        <!-- Actions -->
        <v-btn icon @click="undo" :disabled="historyIndex <= 0">
          <v-icon>mdi-undo</v-icon>
        </v-btn>
        <v-btn icon @click="redo" :disabled="historyIndex >= history.length - 1">
          <v-icon>mdi-redo</v-icon>
        </v-btn>
        <v-btn icon @click="clearCanvas">
          <v-icon>mdi-delete</v-icon>
        </v-btn>
        <v-btn icon @click="saveDrawing">
          <v-icon>mdi-content-save</v-icon>
        </v-btn>
      </v-app-bar>
      
      <v-main>
        <div 
          ref="canvasContainer" 
          class="canvas-container"
          @mousedown="startDrawing"
          @mousemove="draw"
          @mouseup="stopDrawing"
          @mouseleave="stopDrawing"
          @touchstart.prevent="startDrawing"
          @touchmove.prevent="draw"
          @touchend.prevent="stopDrawing"
        >
          <canvas ref="canvas"></canvas>
        </div>
      </v-main>
      
      <!-- Snackbar for notifications -->
      <v-snackbar v-model="snackbar" :timeout="2000">
        {{ snackbarText }}
      </v-snackbar>
    </v-app>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.3.8/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3.4.0/dist/vuetify.min.js"></script>
  <script>
    const { createApp, ref, onMounted, onUnmounted, watch } = Vue;
    const { createVuetify } = Vuetify;

    const vuetify = createVuetify({
      theme: {
        defaultTheme: 'dark'
      }
    });

    const app = createApp({
      setup() {
        const canvas = ref(null);
        const canvasContainer = ref(null);
        const ctx = ref(null);
        const isDrawing = ref(false);
        const currentColor = ref('#FFFFFF');
        const brushSize = ref(5);
        const tool = ref('pen');
        const history = ref([]);
        const historyIndex = ref(-1);
        const snackbar = ref(false);
        const snackbarText = ref('');

        const getCoords = (e) => {
          const rect = canvas.value.getBoundingClientRect();
          if (e.touches) {
            return {
              x: e.touches[0].clientX - rect.left,
              y: e.touches[0].clientY - rect.top
            };
          }
          return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
          };
        };

        const saveState = () => {
          historyIndex.value++;
          history.value = history.value.slice(0, historyIndex.value);
          history.value.push(canvas.value.toDataURL());
          if (history.value.length > 50) {
            history.value.shift();
            historyIndex.value--;
          }
        };

        const startDrawing = (e) => {
          isDrawing.value = true;
          const coords = getCoords(e);
          ctx.value.beginPath();
          ctx.value.moveTo(coords.x, coords.y);
          
          if (tool.value === 'fill') {
            floodFill(Math.floor(coords.x), Math.floor(coords.y));
            isDrawing.value = false;
            saveState();
          }
        };

        const draw = (e) => {
          if (!isDrawing.value || tool.value === 'fill') return;
          
          const coords = getCoords(e);
          ctx.value.lineTo(coords.x, coords.y);
          ctx.value.strokeStyle = tool.value === 'eraser' ? '#1e1e1e' : currentColor.value;
          ctx.value.lineWidth = brushSize.value;
          ctx.value.lineCap = 'round';
          ctx.value.lineJoin = 'round';
          ctx.value.stroke();
        };

        const stopDrawing = () => {
          if (isDrawing.value) {
            isDrawing.value = false;
            saveState();
          }
        };

        const floodFill = (startX, startY) => {
          const imageData = ctx.value.getImageData(0, 0, canvas.value.width, canvas.value.height);
          const data = imageData.data;
          const width = canvas.value.width;
          const height = canvas.value.height;
          
          const startIdx = (startY * width + startX) * 4;
          const startR = data[startIdx];
          const startG = data[startIdx + 1];
          const startB = data[startIdx + 2];
          
          const fillColor = hexToRgb(currentColor.value);
          if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;
          
          const stack = [[startX, startY]];
          const visited = new Set();
          
          while (stack.length > 0) {
            const [x, y] = stack.pop();
            const key = `${x},${y}`;
            
            if (x < 0 || x >= width || y < 0 || y >= height || visited.has(key)) continue;
            
            const idx = (y * width + x) * 4;
            if (Math.abs(data[idx] - startR) > 10 || 
                Math.abs(data[idx + 1] - startG) > 10 || 
                Math.abs(data[idx + 2] - startB) > 10) continue;
            
            visited.add(key);
            data[idx] = fillColor.r;
            data[idx + 1] = fillColor.g;
            data[idx + 2] = fillColor.b;
            data[idx + 3] = 255;
            
            stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
          }
          
          ctx.value.putImageData(imageData, 0, 0);
        };

        const hexToRgb = (hex) => {
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
          } : { r: 255, g: 255, b: 255 };
        };

        const undo = () => {
          if (historyIndex.value > 0) {
            historyIndex.value--;
            const img = new Image();
            img.onload = () => {
              ctx.value.clearRect(0, 0, canvas.value.width, canvas.value.height);
              ctx.value.fillStyle = '#1e1e1e';
              ctx.value.fillRect(0, 0, canvas.value.width, canvas.value.height);
              ctx.value.drawImage(img, 0, 0);
            };
            img.src = history.value[historyIndex.value];
          }
        };

        const redo = () => {
          if (historyIndex.value < history.value.length - 1) {
            historyIndex.value++;
            const img = new Image();
            img.onload = () => {
              ctx.value.clearRect(0, 0, canvas.value.width, canvas.value.height);
              ctx.value.fillStyle = '#1e1e1e';
              ctx.value.fillRect(0, 0, canvas.value.width, canvas.value.height);
              ctx.value.drawImage(img, 0, 0);
            };
            img.src = history.value[historyIndex.value];
          }
        };

        const clearCanvas = () => {
          ctx.value.fillStyle = '#1e1e1e';
          ctx.value.fillRect(0, 0, canvas.value.width, canvas.value.height);
          saveState();
          showSnackbar('Canvas gewist');
        };

        const saveDrawing = () => {
          const link = document.createElement('a');
          const timestamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
          link.download = `tekening-${timestamp}.png`;
          link.href = canvas.value.toDataURL('image/png');
          link.click();
          showSnackbar('Tekening opgeslagen!');
        };

        const showSnackbar = (text) => {
          snackbarText.value = text;
          snackbar.value = true;
        };

        const resizeCanvas = () => {
          const container = canvasContainer.value;
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = canvas.value.width;
          tempCanvas.height = canvas.value.height;
          tempCtx.drawImage(canvas.value, 0, 0);
          
          canvas.value.width = container.clientWidth;
          canvas.value.height = container.clientHeight;
          ctx.value.fillStyle = '#1e1e1e';
          ctx.value.fillRect(0, 0, canvas.value.width, canvas.value.height);
          ctx.value.drawImage(tempCanvas, 0, 0);
        };

        onMounted(() => {
          ctx.value = canvas.value.getContext('2d');
          canvas.value.width = canvasContainer.value.clientWidth;
          canvas.value.height = canvasContainer.value.clientHeight;
          ctx.value.fillStyle = '#1e1e1e';
          ctx.value.fillRect(0, 0, canvas.value.width, canvas.value.height);
          saveState();
          
          window.addEventListener('resize', resizeCanvas);
        });

        onUnmounted(() => {
          window.removeEventListener('resize', resizeCanvas);
        });

        return {
          canvas,
          canvasContainer,
          currentColor,
          brushSize,
          tool,
          history,
          historyIndex,
          snackbar,
          snackbarText,
          startDrawing,
          draw,
          stopDrawing,
          undo,
          redo,
          clearCanvas,
          saveDrawing
        };
      }
    });

    app.use(vuetify);
    app.mount('#app');
  </script>
</body>
</html>
